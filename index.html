            // Zooming an x-range is how you ask "what happened between these two dates?", so answer
            // it: report the move across whatever window is on screen.
            function reportRange(node) {
                const trace = (node.data || []).find((d) => d.type !== "table" && d.y && d.y.length > 1);
                if (!trace) return;
                const note = make("div", "chart-note");
                node.after(note);
                const update = (range) => {
                    let lo = 0, hi = trace.y.length - 1;
                    if (range) {
                        // A string compare is safe here: both sides are ISO date strings, and
                        // Plotly reports a date-axis range as "YYYY-MM-DD[ HH:MM...]".
                        const within = trace.x.map((x, i) => [x, i]).filter(([x]) => x >= range[0] && x <= range[1]);
                        if (within.length > 1) {
                            lo = within[0][1];
                            hi = within[within.length - 1][1];
                        } else {
                            // Fewer than two points in view: say so rather than quietly falling
                            // back to the whole series, which would report the wrong return.
                            note.replaceChildren(make("b", "", "SELECTED"), "too narrow to measure");
                            return;
                        }
                    }
                    const from = trace.y[lo], to = trace.y[hi];
                    if (!from) return;
                    const pct = (to / from - 1) * 100;
                    // Endpoints come from the thinned series the chart plots, so on a multi-year
                    // range they can sit a few sessions either side of the exact drag.
                    note.replaceChildren(make("b", "", "SELECTED"), trace.x[lo] + " \u2192 " + trace.x[hi] + "  ");
                    colorize(note, (pct >= 0 ? "+" : "") + pct.toFixed(2) + "%");
                };
                update(null);
                node.on("plotly_relayout", (e) => {
                    if (e["xaxis.autorange"]) return update(null);
                    const lo = e["xaxis.range[0]"], hi = e["xaxis.range[1]"];
                    if (lo !== undefined) update([lo, hi]);
                });
            }

            // The in-flight run, so it can be stopped: by the STOP button, or by starting a new
            // session. Without this, newSession() left sendBtn disabled forever and every example
            // button silently did nothing.
            let inflight = null;

            function setRunning(on) {
                sendBtn.classList.toggle("stopping", on);
                sendBtn.textContent = on ? "STOP" : "SEND";
                sendBtn.disabled = false;  // never disabled: while running it is the stop control
            }

            function stopRun() {
                if (inflight) inflight.abort();
                inflight = null;
                setRunning(false);
            }

            async function send(forcedText) {
                if (inflight) return stopRun();   // the button is STOP while a run is in flight
                const text = (forcedText || userInput.value).trim();
                if (!text) return;

                userInput.value = "";
                const run = new AbortController();
                inflight = run;
                setRunning(true);
                remember(text);
                if (messages.querySelector(".intro")) messages.replaceChildren();
                // The panel has served its purpose once a question is asked, and it is long.
                addMessage("user", text);
                const loading = addMessage("assistant", "Working...", true);
                const content = loading.querySelector(".content");
                const model = modelSelect.value; // what this question is sent with

                // The page cannot know how far along a run is until /chat returns, so an honest
                // elapsed count beats a fake progress bar. The estimate is deliberately generous:
                // a measured research question lands around 20-40s, and a reader who is told "a
                // minute" and waits 25s is pleased, where the reverse reads as a hang.
                const startedAt = Date.now();
                const ticker = setInterval(() => {
                    const secs = Math.round((Date.now() - startedAt) / 1000);
                    content.textContent = "Working... " + secs + "s" +
                        (secs > 10 ? "  (research fans out; about a minute)" : "");
                }, 1000);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session_id: sessionId, model }),
                        signal: run.signal,
                    });
                    const data = await res.json().catch(() => ({})); // an error page is not JSON
                    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "the server returned " + res.status);
                    sessionId = data.session_id;
                    if (data.tool_calls.length) addRunPanel(model, data.tool_calls, loading);
                    addCharts(data.charts || [], loading);
                    content.replaceChildren();
                    renderText(content, data.response);
                } catch (e) {
                    // An aborted run is a choice, not a failure, so it does not read as an error.
                    content.textContent = e.name === "AbortError"
                        ? "Stopped after " + Math.round((Date.now() - startedAt) / 1000) + "s."
                        : "Error: " + e.message;
                } finally {
                    clearInterval(ticker);
                    if (inflight === run) inflight = null;
                    setRunning(false);
                }
                loading.classList.remove("loading");
                userInput.focus();
                messages.scrollTop = messages.scrollHeight;
            }

            async function newSession() {
                stopRun();  // a run left in flight would finish into a transcript that is gone
                if (sessionId) await fetch("/clear?session_id=" + sessionId, { method: "POST" });
                sessionId = null;
                showIntro();
                userInput.focus();
            }

            // Shell-style history: Up walks back through what was sent, Down returns to the draft.
            // `draft` holds whatever was half-typed, so walking the history never loses it.
            const history = [];
            let historyAt = -1;
            let draft = "";

            function remember(text) {
                if (history[history.length - 1] !== text) history.push(text);
                historyAt = -1;
                draft = "";
            }

            function recall(step) {
                if (!history.length) return;
                if (historyAt === -1) {
                    if (step > 0) return; // already at the live draft
                    draft = userInput.value;
                    historyAt = history.length - 1;
                } else {
                    historyAt += step > 0 ? 1 : -1;
                }
                if (historyAt >= history.length || historyAt < 0) {
                    historyAt = -1;
                    userInput.value = draft;
                } else {
                    userInput.value = history[historyAt];
                }
                // Put the caret at the end rather than wherever it happened to be.
                requestAnimationFrame(() => userInput.setSelectionRange(userInput.value.length, userInput.value.length));
            }

            sendBtn.addEventListener("click", () => send());
            userInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") return send();
                if (e.key === "ArrowUp") {
                    e.preventDefault();
                    recall(-1);
                } else if (e.key === "ArrowDown") {
                    e.preventDefault();
                    recall(1);
                }
            });
            document.getElementById("new-btn").addEventListener("click", newSession);
            if (config.tape.length) drawTape(config.tape); // empty if every quote failed at start-up
            drawSparkles();
            addEventListener("resize", drawSparkles);
            showIntro();
            userInput.focus();
        </script>
    </body>
</html>
