[project]
name = "converge"
version = "0.1.0"
description = "Converge: a deep-research agent that finds, tests and ranks statistical pair trades across US stocks and ETFs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.24",
    "litellm>=1.108",
    "google-cloud-aiplatform>=1.40.0",
    "duckdb>=1.1",
    "requests>=2.31",
    "plotly>=7.1.0",
]
